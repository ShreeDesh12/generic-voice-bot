services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicebot
      POSTGRES_USER: voicebot
      POSTGRES_PASSWORD: voicebot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  voice-bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres
    # Uncomment below to pass host microphone/audio into the container (Linux only)
    # devices:
    #   - /dev/snd:/dev/snd
    # group_add:
    #   - audio
    restart: unless-stopped

volumes:
  pgdata:
