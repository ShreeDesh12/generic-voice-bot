# Add this location block inside your existing server {} block
# in /etc/nginx/sites-available/default (or your site config)
#
# sudo nano /etc/nginx/sites-available/default
# Paste the location block below, then:
# sudo nginx -t && sudo systemctl reload nginx

location /portfolio-bot/ {
    proxy_pass http://127.0.0.1:8000/portfolio-bot/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 10M;
}
